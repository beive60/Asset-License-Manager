[project]
name = "asset-license-manager"
version = "0.1.0"
description = "Asset License Manager MVP"
readme = "README.md"
requires-python = ">=3.11, <3.12"
dependencies = ["PySide6>=6.6.0, <6.9.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pyinstaller>=6.0.0, <7.0.0",
    "pytest>=8.0.0, <9.0.0",
    "pytest-qt>=4.5.0",
    "ruff>=0.3.0, <0.4.0",
]

# Ruff Base Configuration
[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["*.md"]

# Ruff Linter Configuration
[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = []

# Ruff Formatter Configuration
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
